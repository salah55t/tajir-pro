name: Build Android APK (تاجر برو)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify / install Android SDK components
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          if [ -d "$ANDROID_HOME/platforms/android-34" ] && [ -d "$ANDROID_HOME/build-tools/34.0.0" ]; then
            echo "[OK] android-34 + build-tools 34.0.0 are preinstalled on the runner - skipping sdkmanager entirely"
            exit 0
          fi
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          ok=0
          for i in 1 2 3; do
            echo "[ATTEMPT $i/3] installing SDK components..."
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            if "$SDKM" "platforms;android-34" "build-tools;34.0.0" > /dev/null; then
              ok=1
              break
            fi
            echo "sdkmanager failed - waiting 15s before retry..."
            sleep 15
          done
          if [ "$ok" != "1" ]; then
            echo "[FAIL] could not install SDK components after 3 attempts"
            exit 1
          fi

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Prepare APK file
        run: |
          mkdir -p apk-output
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-output/TajirPro-debug.apk
          ls -lh apk-output

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TajirPro-debug-APK
          path: apk-output/TajirPro-debug.apk
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" apk-output/TajirPro-debug.apk \
            --title "تاجر برو ${GITHUB_REF_NAME} — تطبيق أندرويد" \
            --notes "## 📱 تحميل تطبيق تاجر برو (Android)

          ### طريقة التثبيت
          1. حمّل الملف \`TajirPro-debug.apk\` من قسم **Assets** في أسفل هذه الصفحة
          2. افتح الملف على هاتفك وفعّل «التثبيت من مصادر غير معروفة» عند الطلب
          3. ثبّت التطبيق وابدأ الاستخدام

          ### المميزات
          - 🖨️ **طباعة الفواتير حرارياً عبر البلوتوث** (ESC/POS — 58mm / 80mm) باسم المتجر ورمز **QR خاص بكل فاتورة**
          - 🛡️ **التحقق من الفواتير ومكافحة الاحتيال**: امسح كود الفاتورة فيظهر التطبيق الفاتورة المخزنة فعلياً، والفواتير المرتجعة يظهر عليها تحذير
          - 🛒 نقطة بيع سريعة بقارئ باركود بالكاميرا: سلة، خصومات، حساب الباقي تلقائياً
          - 📦 إدارة المخزون: منتجات، كميات، باركود، صلاحية، تنبيهات نفاذ، سجل حركات
          - 💾 نسخ احتياطي (JSON / CSV) — البيانات محفوظة على جهازك فقط
          - 📴 يعمل بدون إنترنت 100%

          > ملاحظة: هذا إصدار Debug مخصص للاستخدام الشخصي والاختبار.
          > لدعم الطباعة: اربط الطابعة الحرارية ببلوتوث الهاتف من إعدادات النظام أولاً." \
            || gh release upload "${GITHUB_REF_NAME}" apk-output/TajirPro-debug.apk --clobber
