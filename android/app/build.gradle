plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tajirpro.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.tajirpro.app"
        minSdk 21
        targetSdk 34
        versionCode 9
        versionName "1.6.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    // WebViewAssetLoader — serves assets over a secure (https) origin so the
    // in-app camera (barcode scanning) works inside the WebView.
    implementation 'androidx.webkit:webkit:1.11.0'
    // توليد رمز QR للفاتورة عند الطباعة الحرارية (مكتبة Java خالصة — تعمل بدون إنترنت)
    implementation 'com.google.zxing:core:3.5.3'
}
