plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tajirpro.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.tajirpro.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

// No external dependencies — pure Android SDK for a fast, reliable build.
